name: Security verification

on:
  push:
    branches:
      - security/auth-hardening-2026-10-30
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/security-ci.yml'

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholder URLs are only for Prisma code generation; no DB is contacted.
      DATABASE_URL: postgresql://user:password@localhost:5432/ci
      DIRECT_URL: postgresql://user:password@localhost:5432/ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
